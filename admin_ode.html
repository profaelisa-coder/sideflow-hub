<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideFlow - LEAD SETUP</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #1A4B84; --sec: #2B6CB0; --gold: #ffb703; --white: #e0e1dd; --blue: #63B3ED; --red: #e63946; --dark: #0A2540; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--white); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 850px; padding-bottom: 50px; }
        .box { background: var(--sec); padding: 25px; border-radius: 12px; margin-bottom: 25px; border-bottom: 4px solid var(--gold); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        h2 { color: var(--gold); text-align: center; letter-spacing: 1px; margin-bottom: 20px; }
        h3 { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; margin-top: 0; font-size: 1.1rem; text-transform: uppercase; }
        .row { display: flex; gap: 15px; margin-bottom: 15px; width: 100%; flex-wrap: wrap; }
        .col { flex: 1; min-width: 150px; display: flex; flex-direction: column; }
        label { font-size: 0.75rem; font-weight: bold; margin-bottom: 5px; color: var(--gold); text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: var(--dark); color: white; box-sizing: border-box; font-size: 0.95rem; }
        button { padding: 14px; border-radius: 8px; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 0.9rem; }
        button:hover { filter: brightness(1.1); }
        .btn-gold { background: var(--gold); color: var(--dark); width: 100%; margin-top: 10px; }
        .btn-blue { background: var(--blue); color: var(--dark); width: 100%; margin-top: 10px; }
        .btn-red { background: var(--red); color: white; width: 100%; margin-top: 10px; }
        .nav-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .btn-nav { background: var(--sec); color: var(--white); border: 1px solid var(--blue); padding: 15px 30px; border-radius: 8px; font-size: 0.85rem; min-width: 160px; }
        .btn-nav:hover { background: var(--blue); color: var(--dark); }
        .catalog-list { width: 100%; margin-bottom: 30px; }
        .catalog-item { display: flex; justify-content: space-between; align-items: center; background: var(--sec); padding: 12px 20px; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid var(--blue); }
        .catalog-info { font-size: 0.9rem; }
        .catalog-info strong { color: var(--gold); margin-right: 10px; }
        .btn-del { background: var(--red); color: white; padding: 8px 12px; font-size: 0.75rem; width: auto; border-radius: 6px; }
        .btn-edit { background: var(--gold); color: var(--dark); padding: 8px 12px; font-size: 0.75rem; width: auto; border-radius: 6px; margin-right: 5px; }
        .reset-link { display: block; text-align: center; color: var(--red); font-size: 0.8rem; text-decoration: none; opacity: 0.5; font-weight: bold; margin-top: 60px; transition: 0.3s; }
        .reset-link:hover { opacity: 1; text-decoration: underline; }
        .prize-config-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-top: 10px; border: 1px dashed var(--gold); width: 100%; }
        .prize-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 10px; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 2000; }
        .modal-content { background: var(--sec); padding: 30px; border-radius: 12px; border-top: 4px solid var(--gold); width: 90%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>

<div id="resetModal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--gold); margin-top: 0;">Confirm Wipe</h3>
        <p style="font-size: 0.85rem; margin-bottom: 20px;">To erase ALL event records, enter Lead Password:</p>
        <input type="password" id="resetPassField" style="margin-bottom: 20px; text-align: center;">
        <div style="display: flex; gap: 10px;">
            <button class="btn-red" style="margin:0; flex:1;" onclick="confirmReset()">WIPE DATA</button>
            <button style="background: #666; color: white; margin:0; flex:1;" onclick="closeResetModal()">CANCEL</button>
        </div>
    </div>
</div>

<div class="container">
    <h2>LEAD COMMAND CENTER</h2>
    
    <div class="box" id="setupSection">
        <h3>Initialize Event</h3>
        <div class="row">
            <div class="col"><label>Event ID (Prefix)</label><input type="text" id="eventId" disabled></div>
            <div class="col" style="flex: 2;"><label>Official Event Name</label><input type="text" id="eventName"></div>
        </div>
        <div class="row">
            <div class="col"><label>Event Dates</label><input type="text" id="eventDates"></div>
            <div class="col"><label>Logo Type</label><select id="logoType"><option value="REGIONAL">Regional Logo</option><option value="PREMIER">IC Logo</option></select></div>
        </div>
        <button class="btn-gold" onclick="saveEventAnchor()">SAVE AND ACTIVATE EVENT</button>
    </div>

    <div class="box">
        <h3>Table Infrastructure</h3>
        <div class="row">
            <div class="col" style="flex: 2;"><label>Total Tables in Sides Area</label><input type="number" id="totalTables"></div>
            <div class="col"><label>Action</label><button class="btn-red" onclick="setupTables()" style="margin-top: 0;">UPDATE TABLES</button></div>
        </div>
    </div>

    <div class="box" id="catalogBox"> 
        <h3 id="catalogTitle">Tournament Catalog Setup</h3>
        <div class="row">
            <div class="col"><label>Event Type</label><select id="catType" onchange="toggleCatFields()"><option value="">-- SELECT --</option><option value="ODE">On-Demand Event (ODE)</option><option value="SCH">Scheduled Event (SCH)</option></select></div>
            <div class="col"><label>Game</label><select id="catGame"><option value="">-- SELECT --</option><option value="TCG">TCG</option><option value="VGC">VGC</option><option value="GO">GO</option><option value="POCKET">POCKET</option></select></div>
        </div>
        <div class="row">
            <div class="col" style="flex: 2;"><label>Tournament Name</label><input type="text" id="catName"></div>
            <div class="col ode-field"><label>Pod Size</label><input type="number" id="catPodSize" oninput="generatePrizeInputs()"></div>
            <div class="col sch-field" style="display:none;"><label>Day / Hour</label><input type="text" id="catHour" placeholder="Ex: Sat - 14:00"></div>
        </div>
        <div class="row">
            <div class="col ode-field"><label>Min Table</label><input type="number" id="catMinTable"></div>
            <div class="col ode-field"><label>Max Table</label><input type="number" id="catMaxTable"></div>
            <div class="col"><label>Entry Fee ($)</label><input type="number" id="catFee"></div>
            <div class="col"><label>Cost ($)</label><input type="number" id="catCost"></div>
        </div>

        <div id="prizeConfigArea" class="prize-config-box" style="display:none;">
            <label style="color: white; font-size: 0.8rem;">Tickets Reward per Position</label>
            <div id="prizeInputsGrid" class="prize-grid"></div>
        </div>

        <button class="btn-blue" id="btnSaveCatalog" onclick="saveCatalog()" style="margin-top: 20px;">ADD TO CATALOG</button>
        <button class="btn-red" id="btnCancelEdit" style="display:none; margin-top:10px;" onclick="cancelEdit()">CANCEL EDIT</button>
    </div>

    <div class="nav-buttons">
        <button class="btn-nav" onclick="navTo('admin_ode.html')">STAFF ODE</button>
        <button class="btn-nav" onclick="navTo('admin_sch.html')">STAFF SCH</button>
        <button class="btn-nav" style="background: var(--gold); color: var(--dark); border: none;" onclick="navTo('final_report.html')">VIEW FINAL REPORT</button>
    </div>

    <div class="catalog-list" id="catalogList"></div>
    
    <a href="javascript:void(0)" class="reset-link" onclick="openResetModal()">WIPE ALL EVENT DATA</a>
</div>

<script>
    const supabaseUrl = 'https://hocpoastnlcwgedvcyqs.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvY3BvYXN0bmxjd2dlZHZjeXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODU0MTYsImV4cCI6MjA4OTg2MTQxNn0.1MvvcFsnGW4e0Bj7mzoUKs_3bGM-eHDJTOqsvgKe-pI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
    const eventPrefix = new URLSearchParams(window.location.search).get('event');
    let editCatalogId = null, catalogDataBackup = [];

    window.onload = async () => {
        if(!eventPrefix) return;
        document.getElementById('eventId').value = eventPrefix;
        const { data: identity } = await _supabase.from('tournament_history').select('*').eq('event_id', eventPrefix).eq('tournament_id', 0).single();
        if(identity) {
            document.getElementById('eventName').value = identity.event_name || "";
            document.getElementById('eventDates').value = identity.event_dates || "";
            document.getElementById('logoType').value = identity.logo_type || "REGIONAL";
            if(identity.event_name) document.getElementById('setupSection').style.display = 'none';
        }
        loadCatalog();
    };

    function toggleCatFields() {
        const type = document.getElementById('catType').value;
        const prizeArea = document.getElementById('prizeConfigArea');
        document.querySelectorAll('.ode-field').forEach(el => el.style.display = (type === 'ODE' ? 'flex' : 'none'));
        document.querySelectorAll('.sch-field').forEach(el => el.style.display = (type === 'SCH' ? 'flex' : 'none'));
        prizeArea.style.display = (type === 'ODE' ? 'block' : 'none');
        if(type === 'ODE') generatePrizeInputs();
    }

    function generatePrizeInputs() {
        const size = parseInt(document.getElementById('catPodSize').value) || 0;
        const grid = document.getElementById('prizeInputsGrid');
        grid.innerHTML = "";
        for(let i = 1; i <= size; i++) {
            grid.innerHTML += `<div class="col"><label>${i}º Place</label><input type="number" class="prize-input" data-pos="${i}" value="0"></div>`;
        }
    }

    async function saveCatalog() {
        const type = document.getElementById('catType').value;
        const tname = document.getElementById('catName').value.trim();
        if(!tname) return alert("Fill Tournament Name");
        let prizeConfig = {}, totalTickets = 0;
        if(type === 'ODE') {
            document.querySelectorAll('.prize-input').forEach(inp => {
                const val = parseInt(inp.value) || 0;
                prizeConfig[inp.dataset.pos] = val;
                totalTickets += val;
            });
        }
        const payload = {
            event_id: eventPrefix, item_type: type, game: document.getElementById('catGame').value,
            tname: tname, tfee: parseFloat(document.getElementById('catFee').value) || 0,
            tcost: parseFloat(document.getElementById('catCost').value) || 0, prizes_config: prizeConfig
        };
        if(type === 'ODE') {
            payload.table_min = parseInt(document.getElementById('catMinTable').value) || 1;
            payload.table_max = parseInt(document.getElementById('catMaxTable').value) || 999;
            payload.pod_size = parseInt(document.getElementById('catPodSize').value) || 4;
            payload.tickets_per_pod = totalTickets;
        } else { payload.thour = document.getElementById('catHour').value.trim(); }

        const { error } = editCatalogId ? await _supabase.from('tournament_catalog').update(payload).eq('id', editCatalogId) : await _supabase.from('tournament_catalog').insert([payload]);
        if(!error) { alert("Tournament Saved!"); cancelEdit(); loadCatalog(); }
    }

    async function loadCatalog() {
        const { data } = await _supabase.from('tournament_catalog').select('*').eq('event_id', eventPrefix).order('id', { ascending: false });
        catalogDataBackup = data || [];
        document.getElementById('catalogList').innerHTML = catalogDataBackup.map(item => `
            <div class="catalog-item"><div class="catalog-info"><strong>${item.item_type}</strong> [${item.game}] ${item.tname}</div>
            <div><button class="btn-edit" onclick="editCatalogItem(${item.id})">EDIT</button><button class="btn-del" onclick="deleteCatalogItem(${item.id})">DEL</button></div></div>`).join('');
    }

    function editCatalogItem(id) {
        const item = catalogDataBackup.find(c => c.id === id);
        if(!item) return;
        editCatalogId = item.id;
        document.getElementById('catType').value = item.item_type;
        toggleCatFields();
        document.getElementById('catGame').value = item.game;
        document.getElementById('catName').value = item.tname;
        document.getElementById('catFee').value = item.tfee;
        document.getElementById('catCost').value = item.tcost;
        if(item.item_type === 'ODE') {
            document.getElementById('catPodSize').value = item.pod_size;
            generatePrizeInputs();
            setTimeout(() => { Object.keys(item.prizes_config || {}).forEach(pos => {
                const inp = document.querySelector(`.prize-input[data-pos="${pos}"]`);
                if(inp) inp.value = item.prizes_config[pos];
            }); }, 100);
        }
        document.getElementById('btnCancelEdit').style.display = 'block';
    }

    function cancelEdit() { editCatalogId = null; location.reload(); }
    async function deleteCatalogItem(id) { if(confirm("Delete Tournament?")) { await _supabase.from('tournament_catalog').delete().eq('id', id); loadCatalog(); } }
    
    function openResetModal() { document.getElementById('resetPassField').value = ""; document.getElementById('resetModal').style.display = 'flex'; }
    function closeResetModal() { document.getElementById('resetModal').style.display = 'none'; }
    
    async function confirmReset() {
        const pass = document.getElementById('resetPassField').value.toUpperCase().trim();
        if (pass === eventPrefix.toUpperCase() + "_LEAD") {
            if(confirm("FINAL WARNING: This will permanently erase ALL event data. Proceed?")) {
                await _supabase.from('tournament_history').delete().eq('event_id', eventPrefix);
                await _supabase.from('tournament_catalog').delete().eq('event_id', eventPrefix);
                await _supabase.from('ode_registrations').delete().eq('event_id', eventPrefix);
                window.location.href = "index.html";
            }
        } else { alert("INCORRECT PASSWORD"); }
    }

    function navTo(page) { window.location.href = `${page}?event=${eventPrefix}`; }
    
    async function setupTables() {
        const qty = parseInt(document.getElementById('totalTables').value);
        if(!qty) return alert("Enter number of tables");
        const { data: ex } = await _supabase.from('event_tables').select('table_number').eq('event_id', eventPrefix).order('table_number', {desc:true});
        const last = ex?.[0]?.table_number || 0;
        let news = [];
        for(let i=last+1; i<=qty; i++) news.push({event_id: eventPrefix, table_number: i, status: 'FREE'});
        await _supabase.from('event_tables').insert(news);
        alert("Tables infrastructure updated!");
    }

    async function saveEventAnchor() {
        const payload = { event_id: eventPrefix, tournament_id: 0, event_name: document.getElementById('eventName').value, event_dates: document.getElementById('eventDates').value, logo_type: document.getElementById('logoType').value, tournament_name: 'SYSTEM_ANCHOR' };
        await _supabase.from('tournament_history').upsert(payload, { onConflict: 'event_id, tournament_id' });
        location.reload();
    }
</script>
</body>
</html>
