<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SideFlow - Judge Area</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #1A4B84; --sec: #2B6CB0; --gold: #ffb703; --white: #e0e1dd; --blue: #63B3ED; --red: #e63946; --green: #2ecc71; --dark: #0A2540; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--white); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .container { width: 100%; max-width: 600px; padding-bottom: 30px; }
        
        .box { background: var(--sec); padding: 25px 20px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-bottom: 5px solid var(--gold); margin-bottom: 20px; }
        
        h2 { color: var(--gold); text-align: center; text-transform: uppercase; margin-top: 10px; margin-bottom: 25px; font-size: 1.6rem; letter-spacing: 1px; }
        
        label { display: block; font-size: 0.9rem; font-weight: bold; margin-bottom: 12px; color: var(--gold); text-align: center; }
        
        input, select { width: 100%; padding: 18px; border-radius: 12px; border: 1.5px solid rgba(255,255,255,0.2); background: var(--dark); color: white; font-size: 1.2rem; box-sizing: border-box; text-align: center; appearance: none; }
        input:focus, select:focus { border-color: var(--gold); outline: none; background: rgba(0,0,0,0.4); }
        
        .btn-search { background: var(--blue); color: var(--dark); font-weight: 900; padding: 18px; border: none; border-radius: 12px; width: 100%; cursor: pointer; margin-top: 15px; text-transform: uppercase; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.2s; }
        .btn-search:active { transform: scale(0.97); }
        
        .player-row { background: rgba(0,0,0,0.25); padding: 20px 15px; border-radius: 12px; margin-top: 15px; display: flex; flex-direction: column; gap: 15px; border-left: 5px solid var(--gold); }
        
        .player-header { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; }
        .player-header b { font-size: 1.3rem; color: var(--white); }
        .player-header small { opacity: 0.8; font-size: 0.95rem; background: var(--dark); padding: 4px 10px; border-radius: 6px; }
        
        .rank-select { margin-top: 5px; border-color: var(--blue); font-weight: bold; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2363B3ED%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 15px top 50%; background-size: 12px auto; }
        
        .btn-save { background: var(--green); color: var(--dark); font-weight: 900; padding: 22px; border: none; border-radius: 12px; width: 100%; cursor: pointer; margin-top: 25px; text-transform: uppercase; font-size: 1.1rem; box-shadow: 0 6px 15px rgba(0,0,0,0.4); transition: 0.2s; }
        .btn-save:active { transform: scale(0.97); }
        
        .info-pod { text-align: center; margin-bottom: 20px; padding: 18px; background: var(--dark); border-radius: 12px; border: 1.5px solid var(--blue); }
        .info-pod b { display: block; font-size: 1.4rem; color: var(--gold); margin-bottom: 5px; }
        .info-pod span { font-size: 1.1rem; opacity: 0.9; font-weight: bold; }
        
        #resultsArea { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>JUDGE CONTROL</h2>
    
    <div class="box">
        <label>ENTER TABLE NUMBER</label>
        <input type="number" id="tableNum" placeholder="Ex: 15" inputmode="numeric">
        <button class="btn-search" onclick="findTable()">SEARCH TABLE</button>
    </div>

    <div id="resultsArea">
        <div class="box">
            <div class="info-pod">
                <b id="displayTour">---</b>
                <span id="displayPod">Pod #--</span>
            </div>

            <div id="playersList"></div>

            <button class="btn-save" onclick="saveResults()">FINISH POD & RELEASE TABLE</button>
        </div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://hocpoastnlcwgedvcyqs.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvY3BvYXN0bmxjd2dlZHZjeXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODU0MTYsImV4cCI6MjA4OTg2MTQxNn0.1MvvcFsnGW4e0Bj7mzoUKs_3bGM-eHDJTOqsvgKe-pI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
    const eventPrefix = new URLSearchParams(window.location.search).get('event');

    let currentPodPlayers = [];
    let currentTourConfig = null;

    async function findTable() {
        const tableNum = document.getElementById('tableNum').value;
        if(!tableNum) return;

        const { data: table, error } = await _supabase.from('event_tables')
            .select('*').eq('event_id', eventPrefix).eq('table_number', tableNum).single();

        if(!table || table.status === 'FREE') {
            alert("Table is empty or not found.");
            return;
        }

        const { data: catalog } = await _supabase.from('tournament_catalog')
            .select('*').eq('event_id', eventPrefix).eq('tname', table.tournament_name).single();
        
        currentTourConfig = catalog;

        const { data: players } = await _supabase.from('ode_registrations')
            .select('*').eq('event_id', eventPrefix).eq('tname', table.tournament_name)
            .eq('pod_number', table.pod_number).in('status', ['waiting', 'allocated']);

        if(!players || players.length === 0) {
            alert("No players found for this Pod.");
            return;
        }

        currentPodPlayers = players;
        renderPlayers(table.tournament_name, table.pod_number);
    }

    function renderPlayers(tourName, podNum) {
        document.getElementById('displayTour').innerText = tourName;
        document.getElementById('displayPod').innerText = `Pod #${podNum}`;
        
        const list = document.getElementById('playersList');
        list.innerHTML = "";

        currentPodPlayers.forEach((p, index) => {
            list.innerHTML += `
                <div class="player-row">
                    <div class="player-header">
                        <b>${p.player_name}</b>
                        <small>ID: ${p.player_id}</small>
                    </div>
                    <select class="rank-select" id="rank-${index}">
                        <option value="">-- SELECT POSITION --</option>
                        ${Array.from({length: currentPodPlayers.length}, (_, i) => `<option value="${i+1}">${i+1}º Place</option>`).join('')}
                        <option value="99">Dropped / No Prize</option>
                    </select>
                </div>
            `;
        });

        document.getElementById('resultsArea').style.display = 'block';
    }

    async function saveResults() {
        if(!confirm("Are you sure? This will award tickets and free the table.")) return;

        const transactions = [];
        const registrationUpdates = [];

        for(let i = 0; i < currentPodPlayers.length; i++) {
            const rank = document.getElementById(`rank-${i}`).value;
            if(!rank) return alert("Please set rank for all players.");

            const player = currentPodPlayers[i];
            const prizeAmount = (currentTourConfig.prizes_config && currentTourConfig.prizes_config[rank]) ? currentTourConfig.prizes_config[rank] : 0;

            if(prizeAmount > 0) {
                transactions.push({
                    event_id: eventPrefix,
                    player_id: player.player_id,
                    player_name: player.player_name,
                    amount: parseInt(prizeAmount),
                    source_type: 'ODE',
                    description: `${rank}º Place - ${currentTourConfig.tname}`
                });
            }

            registrationUpdates.push({
                id: player.id,
                status: 'finished'
            });
        }

        if(transactions.length > 0) {
            await _supabase.from('player_transactions').insert(transactions);
        }

        for(const up of registrationUpdates) {
            await _supabase.from('ode_registrations').update({ status: 'finished' }).eq('id', up.id);
        }

        const tableNum = document.getElementById('tableNum').value;
        await _supabase.from('event_tables').update({ 
            status: 'FREE', 
            tournament_name: null, 
            pod_number: null 
        }).eq('event_id', eventPrefix).eq('table_number', tableNum);

        alert("POD FINISHED! Tickets awarded and table is now FREE.");
        location.reload();
    }
</script>
</body>
</html>
