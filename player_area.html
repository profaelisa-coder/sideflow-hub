<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideFlow - Player Area</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0A2540; --sec: #1A4B84; --gold: #ffb703; --white: #ffffff; --blue: #63B3ED; --red: #e63946; --dark: #051626; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--white); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #authOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .auth-box { width: 100%; max-width: 320px; text-align: center; }
        .auth-box h2 { color: var(--gold); text-transform: uppercase; margin-bottom: 30px; }
        #mainApp { display: none; flex-direction: column; height: 100vh; }
        .top-bar { background: var(--dark); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--gold); }
        .player-id-tag { font-size: 0.8rem; opacity: 0.7; }
        .balance-pill { background: var(--gold); color: var(--dark); padding: 6px 15px; border-radius: 20px; font-weight: 900; font-size: 1rem; box-shadow: 0 4px 10px rgba(255,183,3,0.3); }
        .pager-alert { display: none; background: var(--gold); color: var(--dark); padding: 20px; text-align: center; animation: pulse-bg 1s infinite; border-bottom: 4px solid #000; }
        @keyframes pulse-bg { 0% { background: var(--gold); } 50% { background: #fff; } 100% { background: var(--gold); } }
        .pager-alert h3 { margin: 0; font-size: 1.2rem; font-weight: 900; }
        .pager-alert p { margin: 5px 0 15px 0; font-weight: bold; }
        .btn-stop-pager { background: var(--dark); color: white; border: none; padding: 10px 25px; border-radius: 5px; font-weight: bold; text-transform: uppercase; }
        .content { flex: 1; overflow-y: auto; padding: 20px; }
        .tab-nav { display: flex; background: var(--dark); border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { flex: 1; padding: 15px; border: none; background: transparent; color: white; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; opacity: 0.5; transition: 0.3s; }
        .tab-btn.active { opacity: 1; color: var(--gold); border-bottom: 3px solid var(--gold); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .card { background: var(--sec); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        label { display: block; font-size: 0.7rem; font-weight: bold; margin-bottom: 8px; color: var(--gold); text-transform: uppercase; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: var(--dark); color: white; box-sizing: border-box; font-size: 1rem; margin-bottom: 15px; }
        button.primary { width: 100%; padding: 15px; border-radius: 8px; border: none; font-weight: bold; text-transform: uppercase; background: var(--blue); color: var(--dark); cursor: pointer; }
        button.primary:disabled { opacity: 0.5; }
        .history-item { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--gold); display: flex; justify-content: space-between; align-items: center; }
        .history-info { display: flex; flex-direction: column; }
        .history-info b { font-size: 0.9rem; }
        .history-info small { font-size: 0.7rem; opacity: 0.6; margin-top: 5px; }
        .history-val { font-weight: 900; font-size: 1.1rem; }
        .val-plus { color: #2ecc71; }
        .val-minus { color: var(--red); }
    </style>
</head>
<body>

<div id="authOverlay">
    <div class="auth-box" id="step1">
        <h2>PLAYER LOGIN</h2>
        <label>ENTER PLAYER ID</label>
        <input type="number" id="loginId" placeholder="EX: 12345" inputmode="numeric">
        <button class="primary" onclick="handleLogin()">NEXT</button>
    </div>
    <div class="auth-box" id="step2" style="display: none;">
        <h2 id="passTitle">PASSWORD</h2>
        <p id="passSub" style="font-size: 0.8rem; margin-bottom: 20px; opacity: 0.7;"></p>
        <input type="password" id="loginPass" placeholder="*****" inputmode="numeric" maxlength="5">
        <button class="primary" id="btnPass" onclick="handlePass()">UNLOCK</button>
    </div>
</div>

<div id="mainApp">
    <div class="pager-alert" id="pager">
        <h3>MESA ENCONTRADA!</h3>
        <p id="pagerText"></p>
        <button class="btn-stop-pager" onclick="stopPager()">ESTOU A CAMINHO</button>
    </div>

    <div class="top-bar">
        <div class="player-id-tag" id="displayPlayer">ID: ---</div>
        <div class="balance-pill" id="displayBalance">0 TKS</div>
    </div>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab(event, 'tab-home')">HOME</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-transfer')">TRANSFERIR</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-history')">HISTÓRICO</button>
    </div>

    <div class="content">
        <div id="tab-home" class="tab-content active">
            <div class="card">
                <label>PLAYER NAME</label>
                <div id="playerName" style="font-size: 1.2rem; font-weight: bold;">---</div>
            </div>
            <div id="activePodCard" class="card" style="display: none; border-left: 4px solid var(--blue);">
                <label>TORNEIO ATUAL</label>
                <div id="activePodName" style="font-weight: bold;">---</div>
                <div id="activePodStatus" style="font-size: 0.8rem; opacity: 0.8; margin-top: 5px;">Aguardando Mesa...</div>
            </div>
        </div>

        <div id="tab-transfer" class="tab-content">
            <div class="card">
                <label>ID DO AMIGO</label>
                <input type="number" id="destId" oninput="checkDestName()" placeholder="EX: 9999">
                <div id="destName" style="font-size: 0.8rem; color: var(--gold); margin-top: -10px; margin-bottom: 15px; height: 15px;"></div>
                <label>QUANTIDADE DE TICKETS</label>
                <input type="number" id="transAmount" placeholder="0">
                <button class="primary" id="btnTransfer" onclick="executeTransfer()" disabled>CONFIRMAR TRANSFERÊNCIA</button>
            </div>
        </div>

        <div id="tab-history" class="tab-content">
            <div id="historyList"></div>
        </div>
    </div>
</div>

<audio id="beep" loop>
    <source src="https://actions.google.com/sounds/v1/alarms/alarm_clock_short_beeps.ogg" type="audio/ogg">
</audio>

<script>
    const supabaseUrl = 'https://hocpoastnlcwgedvcyqs.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvY3BvYXN0bmxjd2dlZHZjeXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODU0MTYsImV4cCI6MjA4OTg2MTQxNn0.1MvvcFsnGW4e0Bj7mzoUKs_3bGM-eHDJTOqsvgKe-pI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

    let currentPlayer = null;
    let pagerActive = false;
    let lastStatus = null;

    async function handleLogin() {
        const id = document.getElementById('loginId').value;
        if(!id) return;
        const { data, error } = await _supabase.from('ode_registrations').select('*').eq('player_id', id).limit(1).single();
        if(error || !data) return alert("ID NÃO ENCONTRADO");
        currentPlayer = data;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        if(!data.player_password) {
            document.getElementById('passTitle').innerText = "CRIAR SENHA";
            document.getElementById('passSub').innerText = "DEFINA UMA SENHA DE 5 DÍGITOS PARA SUA SEGURANÇA";
            document.getElementById('btnPass').innerText = "CRIAR E ENTRAR";
        } else {
            document.getElementById('passTitle').innerText = "ENTRAR";
            document.getElementById('passSub').innerText = "DIGITE SUA SENHA DE 5 DÍGITOS";
        }
    }

    async function handlePass() {
        const pass = document.getElementById('loginPass').value;
        if(pass.length !== 5) return alert("A SENHA DEVE TER 5 DÍGITOS");
        if(!currentPlayer.player_password) {
            const { error } = await _supabase.from('ode_registrations').update({ player_password: pass }).eq('id', currentPlayer.id);
            if(error) return alert("ERRO AO SALVAR SENHA");
            currentPlayer.player_password = pass;
        } else {
            if(currentPlayer.player_password !== pass) return alert("SENHA INCORRETA");
        }
        document.getElementById('authOverlay').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';
        startApp();
    }

    function startApp() {
        document.getElementById('displayPlayer').innerText = "ID: " + currentPlayer.player_id;
        document.getElementById('playerName').innerText = currentPlayer.player_name;
        updateData();
        setInterval(updateData, 10000);
        _supabase.channel('player_watch')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'ode_registrations', filter: `player_id=eq.${currentPlayer.player_id}` }, updateData)
            .subscribe();
    }

    async function updateData() {
        const { data: player } = await _supabase.from('ode_registrations').select('*').eq('player_id', currentPlayer.player_id).order('created_at', {ascending: false});
        if(!player) return;
        const currentReg = player[0];
        const status = currentReg.status;
        if(status === 'allocated' && lastStatus !== 'allocated') {
            startPager(currentReg.tname, currentReg.assigned_table);
        }
        lastStatus = status;
        const podCard = document.getElementById('activePodCard');
        if(status === 'waiting' || status === 'allocated') {
            podCard.style.display = 'block';
            document.getElementById('activePodName').innerText = currentReg.tname;
            document.getElementById('activePodStatus').innerText = status === 'allocated' ? "MESA " + currentReg.assigned_table : "Aguardando Fechamento/Mesa...";
        } else {
            podCard.style.display = 'none';
        }
        const { data: trans } = await _supabase.from('player_transactions').select('*').eq('player_id', currentPlayer.player_id);
        const total = trans ? trans.reduce((acc, curr) => acc + curr.amount, 0) : 0;
        document.getElementById('displayBalance').innerText = total + " TKS";
        renderHistory(trans, player);
    }

    function renderHistory(trans, regs) {
        const list = document.getElementById('historyList');
        const items = trans ? trans.map(t => ({
            desc: t.description,
            val: t.amount,
            date: new Date(t.created_at)
        })) : [];
        regs.filter(r => r.status === 'finished').forEach(r => {
            items.push({ desc: r.tname, val: 0, date: new Date(r.created_at), isGame: true });
        });
        items.sort((a, b) => b.date - a.date);
        list.innerHTML = items.map(i => `
            <div class="history-item">
                <div class="history-info">
                    <b>${i.desc}</b>
                    <small>${i.date.toLocaleDateString()} ${i.date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</small>
                </div>
                <div class="history-val ${i.val >= 0 ? 'val-plus' : 'val-minus'}">
                    ${i.val === 0 && i.isGame ? 'JOGADO' : (i.val > 0 ? '+' : '') + i.val}
                </div>
            </div>
        `).join('');
    }

    async function checkDestName() {
        const id = document.getElementById('destId').value;
        const display = document.getElementById('destName');
        const btn = document.getElementById('btnTransfer');
        if(id.length < 2) { display.innerText = ""; btn.disabled = true; return; }
        const { data } = await _supabase.from('ode_registrations').select('player_name').eq('player_id', id).limit(1).single();
        if(data) {
            display.innerText = "Destinatário: " + data.player_name;
            btn.disabled = false;
        } else {
            display.innerText = "ID não encontrado";
            btn.disabled = true;
        }
    }

    async function executeTransfer() {
        const destId = document.getElementById('destId').value;
        const amount = parseInt(document.getElementById('transAmount').value);
        const balanceText = document.getElementById('displayBalance').innerText;
        const balance = parseInt(balanceText);
        if(!amount || amount <= 0) return alert("Digite um valor válido");
        if(amount > balance) return alert("Saldo insuficiente");
        const btn = document.getElementById('btnTransfer');
        btn.disabled = true;
        btn.innerText = "PROCESSANDO...";
        const { error: err1 } = await _supabase.from('player_transactions').insert([
            { player_id: currentPlayer.player_id, amount: -amount, description: "Transferência para ID " + destId, source_type: 'TRANSFER_SEND' }
        ]);
        if(!err1) {
            await _supabase.from('player_transactions').insert([
                { player_id: destId, amount: amount, description: "Transferência de ID " + currentPlayer.player_id, source_type: 'TRANSFER_RECV' }
            ]);
            alert("TRANSFERÊNCIA CONCLUÍDA!");
            document.getElementById('destId').value = "";
            document.getElementById('transAmount').value = "";
            updateData();
        } else {
            alert("ERRO NA TRANSAÇÃO");
        }
        btn.disabled = false;
        btn.innerText = "CONFIRMAR TRANSFERÊNCIA";
    }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    function startPager(tour, table) {
        pagerActive = true;
        document.getElementById('pager').style.display = 'block';
        document.getElementById('pagerText').innerText = tour + " - DIRIJA-SE À MESA " + table;
        document.getElementById('beep').play();
        if ("vibrate" in navigator) navigator.vibrate([500, 300, 500, 300, 500]);
    }

    function stopPager() {
        pagerActive = false;
        document.getElementById('pager').style.display = 'none';
        const audio = document.getElementById('beep');
        audio.pause();
        audio.currentTime = 0;
        if ("vibrate" in navigator) navigator.vibrate(0);
    }

    document.addEventListener('click', () => {
        const audio = document.getElementById('beep');
        if (audio.paused && !pagerActive) {
            audio.play().then(() => audio.pause());
        }
    }, { once: true });
</script>
</body>
</html>```
