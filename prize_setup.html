<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SideFlow - Prize Setup</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #1A4B84; --sec: #2B6CB0; --gold: #ffb703; --white: #e0e1dd; --blue: #63B3ED; --red: #e63946; --dark: #0A2540; --green: #2ecc71; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--white); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; padding-bottom: 50px; }
        .box { background: var(--sec); padding: 30px; border-radius: 15px; margin-bottom: 30px; border-bottom: 5px solid var(--gold); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        h2 { color: var(--gold); text-align: center; letter-spacing: 2px; text-transform: uppercase; font-size: 1.8rem; }
        h3 { border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; margin-top: 0; font-size: 1.3rem; text-transform: uppercase; }
        .row { display: flex; gap: 20px; margin-bottom: 20px; width: 100%; flex-wrap: wrap; }
        .col { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        label { font-size: 0.9rem; font-weight: bold; margin-bottom: 8px; color: var(--gold); text-transform: uppercase; }
        input, select { width: 100%; padding: 16px; border-radius: 10px; border: 1.5px solid rgba(255,255,255,0.2); background: var(--dark); color: white; box-sizing: border-box; font-size: 1.1rem; }
        button { padding: 18px; border-radius: 10px; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        button:hover { filter: brightness(1.1); }
        .btn-gold { background: var(--gold); color: var(--dark); width: 100%; }
        .btn-blue { background: var(--blue); color: var(--dark); width: 100%; }
        .btn-red { background: var(--red); color: white; width: 100%; }
        .nav-buttons { display: flex; gap: 15px; justify-content: center; margin-bottom: 40px; }
        .btn-nav { background: var(--sec); color: var(--white); border: 2px solid var(--blue); padding: 15px 30px; border-radius: 10px; font-size: 1rem; }
        .catalog-item { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 20px; border-radius: 12px; margin-bottom: 12px; border-left: 6px solid var(--blue); }
        .catalog-info { font-size: 1.1rem; }
        .catalog-info strong { color: var(--gold); margin-right: 15px; }
        .btn-del { background: var(--red); color: white; padding: 12px 20px; font-size: 0.9rem; width: auto; border-radius: 8px; }
        .btn-edit { background: var(--gold); color: var(--dark); padding: 12px 20px; font-size: 0.9rem; width: auto; border-radius: 8px; margin-right: 10px; }
        .btn-cam { background: transparent; color: var(--white); border: 1.5px solid var(--white); padding: 8px; border-radius: 6px; font-size: 1.2rem; cursor: pointer; margin-right: 12px; }
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 5000; }
        .modal-content { background: var(--sec); padding: 40px; border-radius: 20px; border-top: 6px solid var(--gold); width: 90%; max-width: 500px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        #imgPreview { max-width: 100%; max-height: 400px; border-radius: 12px; margin-top: 15px; border: 3px solid var(--gold); }
        #loginOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 6000; }
        #loginOverlay input { width: 300px; text-align: center; margin-bottom: 30px; padding: 20px; font-size: 1.5rem; }
        .void-list { margin-top: 20px; }
        .void-row { background: var(--white); color: #222; padding: 15px 20px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .void-row b { color: var(--red); font-size: 1.2rem; }
        .btn-void-action { background: var(--red); color: white; padding: 12px 25px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div id="loginOverlay">
    <h2>PRIZE LEAD ACCESS</h2>
    <input type="password" id="passInput" placeholder="ACCESS CODE">
    <button onclick="checkLogin()" class="btn-gold" style="width: 300px;">UNLOCK</button>
</div>

<div id="photoModal" class="modal" onclick="closePhotoModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 style="color: var(--gold); margin-top: 0;">PRODUCT PREVIEW</h3>
        <img id="imgPreview" src="" alt="Preview">
        <button class="btn-blue" style="margin-top: 30px; width: 100%;" onclick="closePhotoModal()">CLOSE</button>
    </div>
</div>

<div id="voidModal" class="modal">
    <div class="modal-content">
        <h3 style="color: var(--gold);">VOID TRANSACTION</h3>
        <p id="voidInfo" style="margin-bottom: 20px; font-size: 1.1rem;"></p>
        <label>How many units are being returned?</label>
        <input type="number" id="voidQty" style="text-align: center; margin-bottom: 30px;" inputmode="numeric">
        <div style="display: flex; gap: 15px;">
            <button class="btn-gold" style="flex: 1;" onclick="confirmVoid()">CONFIRM</button>
            <button class="btn-red" style="flex: 1; background: #666;" onclick="closeVoidModal()">CANCEL</button>
        </div>
    </div>
</div>

<div class="container" id="mainContent" style="display:none;">
    <h2>PRIZE WALL SETUP</h2>

    <div class="nav-buttons">
        <button class="btn-nav" onclick="goToSales()" style="background: var(--gold); color: var(--dark); border:none;">GO TO SALES</button>
    </div>

    <div class="box">
        <h3>ADD / EDIT PRODUCT</h3>
        <div class="row">
            <div class="col" style="flex: 2;">
                <label>Product Name</label>
                <input type="text" id="prodName">
            </div>
            <div class="col">
                <label>Stock Quantity</label>
                <input type="number" id="prodStock">
            </div>
        </div>
        <div class="row">
            <div class="col">
                <label>Price (Prize Tickets)</label>
                <input type="number" id="prodCost">
            </div>
            <div class="col" style="flex: 2;">
                <label>Image URL (Optional)</label>
                <input type="text" id="prodImg" placeholder="https://...">
            </div>
        </div>
        <button class="btn-blue" id="btnSave" onclick="saveProduct()">ADD TO INVENTORY</button>
        <button class="btn-red" id="btnCancel" style="display:none; margin-top:15px;" onclick="cancelEdit()">CANCEL EDIT</button>
    </div>

    <div class="box">
        <h3>CURRENT INVENTORY</h3>
        <div id="inventoryList"></div>
    </div>

    <div class="box">
        <h3>VOID TRANSACTION</h3>
        <div class="row" style="align-items: flex-end;">
            <div class="col" style="flex: 2;">
                <label>Search Player ID</label>
                <input type="number" id="searchPlayerId" placeholder="Enter ID to find purchases" inputmode="numeric">
            </div>
            <div class="col">
                <button class="btn-blue" onclick="searchTransactions()" style="margin-top: 0;">SEARCH</button>
            </div>
        </div>
        <div id="voidList" class="void-list"></div>
    </div>
</div>

<script>
    const supabaseUrl = 'https://hocpoastnlcwgedvcyqs.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvY3BvYXN0bmxjd2dlZHZjeXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyODU0MTYsImV4cCI6MjA4OTg2MTQxNn0.1MvvcFsnGW4e0Bj7mzoUKs_3bGM-eHDJTOqsvgKe-pI';
    const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
    const urlParams = new URLSearchParams(window.location.search);
    const eventPrefix = urlParams.get('event');
    
    let editId = null;
    let pendingVoid = null;

    window.onload = () => {
        if(sessionStorage.getItem('pl_auth') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            loadInventory();
        }
    };

    function checkLogin() {
        const pass = document.getElementById('passInput').value.toUpperCase().trim();
        if(pass === eventPrefix.toUpperCase() + "_PL") {
            sessionStorage.setItem('pl_auth', 'true');
            location.reload();
        } else { alert("ACCESS DENIED."); }
    }
    
    function goToSales() {
        sessionStorage.setItem('ps_auth', 'true');
        location.href = 'prize_staff.html?event=' + eventPrefix;
    }

    async function loadInventory() {
        const { data } = await _supabase.from('prize_inventory').select('*').eq('event_id', eventPrefix).order('product_name');
        const list = document.getElementById('inventoryList');
        list.innerHTML = data.length ? data.map(item => `
            <div class="catalog-item">
                <div class="catalog-info">
                    ${item.image_url ? `<button class="btn-cam" onclick="viewPhoto('${item.image_url}')">📷</button>` : ''}
                    <strong>${item.product_name}</strong>
                    <small>| Stock: ${item.stock_quantity} | ${item.ticket_cost} Tks</small>
                </div>
                <div>
                    <button class="btn-edit" onclick="editItem(${JSON.stringify(item).replace(/"/g, '&quot;')})">EDIT</button>
                    <button class="btn-del" onclick="deleteItem(${item.id})">DEL</button>
                </div>
            </div>
        `).join('') : "<p style='opacity:0.5; text-align:center;'>No products found.</p>";
    }

    function viewPhoto(url) {
        document.getElementById('imgPreview').src = url;
        document.getElementById('photoModal').style.display = 'flex';
    }
    function closePhotoModal() { document.getElementById('photoModal').style.display = 'none'; }

    function editItem(item) {
        editId = item.id;
        document.getElementById('prodName').value = item.product_name;
        document.getElementById('prodStock').value = item.stock_quantity;
        document.getElementById('prodCost').value = item.ticket_cost;
        document.getElementById('prodImg').value = item.image_url || "";
        document.getElementById('btnSave').innerText = "UPDATE PRODUCT";
        document.getElementById('btnCancel').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function cancelEdit() {
        editId = null;
        document.getElementById('prodName').value = "";
        document.getElementById('prodStock').value = "";
        document.getElementById('prodCost').value = "";
        document.getElementById('prodImg').value = "";
        document.getElementById('btnSave').innerText = "ADD TO INVENTORY";
        document.getElementById('btnCancel').style.display = 'none';
    }

    async function saveProduct() {
        const payload = {
            event_id: eventPrefix,
            product_name: document.getElementById('prodName').value.trim(),
            stock_quantity: parseInt(document.getElementById('prodStock').value) || 0,
            ticket_cost: parseInt(document.getElementById('prodCost').value) || 0,
            image_url: document.getElementById('prodImg').value.trim()
        };
        if(!payload.product_name) return alert("Name required.");

        if(editId) { await _supabase.from('prize_inventory').update(payload).eq('id', editId); } 
        else { await _supabase.from('prize_inventory').insert([payload]); }
        
        cancelEdit(); loadInventory(); alert("Saved!");
    }

    async function deleteItem(id) {
        if(confirm("Delete item?")) {
            await _supabase.from('prize_inventory').delete().eq('id', id);
            loadInventory();
        }
    }

    async function searchTransactions() {
        const pid = document.getElementById('searchPlayerId').value.trim();
        if(!pid) return;
        
        const { data } = await _supabase.from('player_transactions')
            .select('*').eq('event_id', eventPrefix).eq('player_id', pid).eq('source_type', 'PRIZE_WALL')
            .order('created_at', {ascending: false});
        
        const list = document.getElementById('voidList');
        list.innerHTML = data.length ? data.map(t => {
            const match = t.description.match(/(\d+)x/);
            const qty = match ? parseInt(match[1]) : 1;
            return `
                <div class="void-row">
                    <span><b>${Math.abs(t.amount)} TKS</b> | ${t.description}</span>
                    <button class="btn-void-action" onclick="openVoidModal(${t.id}, '${t.player_id}', ${t.amount}, '${t.description}', ${qty})">VOID</button>
                </div>`;
        }).join('') : "No transactions found.";
    }

    function openVoidModal(id, pid, amount, desc, maxQty) {
        if(desc.includes("VOID")) return alert("Already voided.");
        pendingVoid = { id, pid, totalAmount: Math.abs(amount), desc, maxQty };
        document.getElementById('voidInfo').innerHTML = `<b>${desc}</b><br>Max units to return: ${maxQty}`;
        document.getElementById('voidQty').value = maxQty;
        document.getElementById('voidModal').style.display = 'flex';
    }

    function closeVoidModal() {
        document.getElementById('voidModal').style.display = 'none';
        pendingVoid = null;
    }

    async function confirmVoid() {
        const qtyToReturn = parseInt(document.getElementById('voidQty').value);
        if(!qtyToReturn || qtyToReturn <= 0 || qtyToReturn > pendingVoid.maxQty) {
            return alert("Invalid quantity. Max is " + pendingVoid.maxQty);
        }

        const unitValue = pendingVoid.totalAmount / pendingVoid.maxQty;
        const refundAmount = unitValue * qtyToReturn;

        await _supabase.from('player_transactions').insert([{
            event_id: eventPrefix, 
            player_id: pendingVoid.pid, 
            amount: refundAmount,
            source_type: 'PRIZE_WALL', 
            description: `VOID PARTIAL: ${qtyToReturn}x ${pendingVoid.desc.replace("Redemption: ", "").split('(')[0]} - Refunded ${refundAmount} TKS`
        }]);

        const productName = pendingVoid.desc.replace("Redemption: ", "").split('(')[0].trim();
        const { data: current } = await _supabase.from('prize_inventory').select('*').eq('event_id', eventPrefix).eq('product_name', productName).single();
        if(current) {
            await _supabase.from('prize_inventory').update({ stock_quantity: current.stock_quantity + qtyToReturn }).eq('id', current.id);
        }

        const newDesc = "VOIDED (" + qtyToReturn + "/" + pendingVoid.maxQty + "): " + pendingVoid.desc;
        await _supabase.from('player_transactions').update({ description: newDesc }).eq('id', pendingVoid.id);

        alert("Partial Void Successful!");
        closeVoidModal();
        searchTransactions();
        loadInventory();
    }
</script>
</body>
</html>
